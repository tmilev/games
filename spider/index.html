<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Spider Solitaire</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="banner" class="banner">All columns must contain at least one card to deal!</div>

  <header>
    <div class="header-left">
      <h1>Spider Solitaire</h1>
      <a href="../index.html" class="nav-link">&larr; Back to Home</a>
    </div>

    <div class="controls">
      <label for="difficultySelect">Suits: </label>
      <select id="difficultySelect">
        <option value="1" selected>1 Suit (Spades - Easy)</option>
        <option value="2">2 Suits (Spades & Hearts - Medium)</option>
        <option value="4">4 Suits (Hard)</option>
      </select>
      <div class="stat-badge">Moves: <span id="movesCount">0</span></div>
      <div class="stat-badge">Score: <span id="scoreVal">500</span></div>
      <div class="stat-badge zoom-controls">
        <button id="zoomOutBtn" class="zoom-btn" title="Zoom Out">&minus;</button>
        <span id="zoomVal">100%</span>
        <button id="zoomInBtn" class="zoom-btn" title="Zoom In">&plus;</button>
      </div>
      <button id="undoBtn" class="btn" title="Undo (Ctrl+Z)">Undo</button>
      <button id="redoBtn" class="btn" title="Redo (Ctrl+Y or Ctrl+Shift+Z)">Redo</button>
      <button id="settingsBtn" class="btn" title="Settings">⚙️ Settings</button>
      <button id="newGameBtn" class="btn">New Game</button>
    </div>
  </header>

  <div class="table-container">
    <div class="top-area">
      <!-- Completed Runs (Foundations) -->
      <div class="completed-sets-container" id="completedContainer"></div>

      <!-- Stock piles (5 deals of 10 cards) -->
      <div class="stock-container" id="stockContainer"></div>
    </div>

    <!-- 10 Tableau Columns -->
    <div class="tableau-container" id="tableauContainer"></div>
  </div>

  <!-- Settings Modal Dialog -->
  <div id="settingsOverlay" class="overlay hidden">
    <div class="settings-modal">
      <div class="settings-header">
        <h3>Game Settings</h3>
        <button id="closeSettingsBtn" class="close-btn" title="Close">&times;</button>
      </div>

      <div class="setting-item">
        <label for="bgThemeSelect">Background Felt:</label>
        <select id="bgThemeSelect">
          <option value="classic-green">Classic Green Felt</option>
          <option value="dark-slate">Dark Slate / Midnight</option>
          <option value="royal-blue">Royal Blue</option>
          <option value="burgundy">Burgundy Red</option>
          <option value="emerald">Deep Emerald</option>
        </select>
      </div>

      <div class="setting-item">
        <label for="deckColorSelect">Deck / Card-Back Color:</label>
        <select id="deckColorSelect">
          <option value="classic-blue">Classic Navy Blue</option>
          <option value="crimson-red">Crimson Red</option>
          <option value="emerald-green">Emerald Green</option>
          <option value="amethyst-purple">Amethyst Purple</option>
          <option value="carbon-black">Carbon / Obsidian</option>
        </select>
      </div>

      <div class="setting-item">
        <label for="animSpeedSelect">Dealing Animation Speed:</label>
        <select id="animSpeedSelect">
          <option value="fast">Fast (20ms / 0.28s)</option>
          <option value="normal" selected>Normal (50ms / 0.42s)</option>
          <option value="slow">Slow (100ms / 0.8s)</option>
          <option value="super-slow">Super Slow-Mo (200ms / 2.0s)</option>
          <option value="instant">Instant (No Animation)</option>
        </select>
      </div>

      <div class="settings-actions">
        <button id="saveSettingsBtn" class="btn" style="width: 100%;">Done</button>
      </div>
    </div>
  </div>

  <div id="winOverlay" class="overlay hidden">
    <h2>Congratulations! 🎉</h2>
    <p id="winStats">You cleared all 8 card sequences!</p>
    <button id="winNewGameBtn" class="btn" style="font-size: 1.1rem; padding: 12px 30px;">Play Another Game</button>
  </div>

  <script src="spider.js"></script>
</body>
</html>
